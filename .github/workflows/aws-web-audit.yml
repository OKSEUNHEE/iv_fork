name: AWS Web Service Audit

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -T 10 -H "$SSH_HOST" >> ~/.ssh/known_hosts
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Inspect published web services
        run: |
          ssh -i ~/.ssh/audit_key "$SSH_USER@$SSH_HOST" '
            set -eu
            echo "== Host =="
            hostname
            echo "== Docker containers with published ports =="
            sudo docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Ports}}\t{{.Status}}"
            echo "== Docker Compose projects =="
            sudo docker compose ls || true
            echo "== TCP listeners =="
            sudo ss -ltnp
            echo "== Web proxy services =="
            sudo systemctl is-active nginx || true
            sudo systemctl is-active apache2 || true
            sudo systemctl is-active caddy || true
            echo "== Nginx virtual hosts (domain and upstream only) =="
            sudo nginx -T 2>&1 | grep -E "^[[:space:]]*(listen|server_name|proxy_pass|root)[[:space:]]" || true
            echo "== Host Uvicorn processes =="
            sudo ps -eo pid,user,args | grep "[u]vicorn" || true
            echo "== new-biz2 process owner =="
            sudo cat /proc/4983/cgroup 2>/dev/null || true
            echo "== new-biz2 system services =="
            sudo systemctl list-unit-files --no-legend | grep -Ei "new[-_]?biz|landing" || true
            sudo systemctl list-units --all --no-legend | grep -Ei "new[-_]?biz|landing" || true
            echo "== Nginx files serving port 8081 =="
            sudo grep -rlE "listen[[:space:]]+(\[::\]:)?8081|new-biz-landing" /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true
          '
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
