name: Publish Images to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: edumgt
  BACKEND_IMAGE: edumgt/investment-analysis-backend
  QDRANT_IMAGE: edumgt/investment-analysis-qdrant
  MONGO_IMAGE: edumgt/investment-analysis-mongo
  QDRANT_SOURCE_IMAGE: qdrant/qdrant:v1.13.4
  MONGO_SOURCE_IMAGE: mongo:7

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push application backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mirror Qdrant image to Docker Hub namespace
        run: |
          docker pull "$QDRANT_SOURCE_IMAGE"
          docker tag "$QDRANT_SOURCE_IMAGE" "$QDRANT_IMAGE:v1.13.4"
          docker tag "$QDRANT_SOURCE_IMAGE" "$QDRANT_IMAGE:latest"
          docker push "$QDRANT_IMAGE:v1.13.4"
          docker push "$QDRANT_IMAGE:latest"

      - name: Mirror MongoDB image to Docker Hub namespace
        run: |
          docker pull "$MONGO_SOURCE_IMAGE"
          docker tag "$MONGO_SOURCE_IMAGE" "$MONGO_IMAGE:7"
          docker tag "$MONGO_SOURCE_IMAGE" "$MONGO_IMAGE:latest"
          docker push "$MONGO_IMAGE:7"
          docker push "$MONGO_IMAGE:latest"
