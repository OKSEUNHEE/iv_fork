name: Stop Auxiliary AWS Web Services

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stop-auxiliary-services:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/stop_key
          chmod 600 ~/.ssh/stop_key
          ssh-keyscan -T 10 -H "$SSH_HOST" >> ~/.ssh/known_hosts
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Stop non-investment web services
        run: |
          ssh -i ~/.ssh/stop_key "$SSH_USER@$SSH_HOST" '
            set -eu
            # Stop and disable the unrelated host-based FastAPI service.
            sudo systemctl disable --now new-biz2-backend.service
            # Stop the unrelated Compose project without deleting its database volume.
            sudo docker compose -f /opt/new-biz2/docker-compose.yml down --remove-orphans
            # Disable only the Nginx site that listens on 8081; retain iv.edumgt.co.kr on port 80.
            sudo rm -f /etc/nginx/sites-enabled/new-biz-landing
            sudo nginx -t
            sudo systemctl restart nginx
            echo "== Remaining published containers =="
            sudo docker ps --format "table {{.Names}}\t{{.Ports}}\t{{.Status}}"
            echo "== Remaining web listeners =="
            sudo ss -ltnp | grep -E ":(80|8000|8081|8801|3307)[[:space:]]" || true
            echo "== investment-analysis health =="
            curl -fsS http://localhost:8801/api/health
          '
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
