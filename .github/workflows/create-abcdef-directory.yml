name: Create abcdef Directory

on:
  push:
  workflow_dispatch:

# 빈 디렉터리는 Git이 추적하지 않으므로 .gitkeep을 커밋해 저장소에 남긴다.
permissions:
  contents: write

jobs:
  create-directory:
    # 이 워크플로가 만든 커밋으로 다시 실행되는 일을 피한다.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create abcdef directory
        run: mkdir -p abcdef && touch abcdef/.gitkeep

      - name: Commit directory when newly created
        run: |
          if git diff --quiet -- abcdef/.gitkeep; then
            echo "abcdef directory already exists."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add abcdef/.gitkeep
          git commit -m "chore: create abcdef directory"
          git push
