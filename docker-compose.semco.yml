name: samsung-electro-lean

# 삼성전기(009150.KS) LEAN 백테스트 실행 구성입니다.
services:
  samsung-electro-backtest:
    build:
      context: ./lean-samsung-electro
    image: samsung-electro-lean-module:local
    environment:
      # Yahoo Finance에서 내려받을 009150.KS 일봉 기간입니다.
      SAMSUNG_ELECTRO_START_DATE: ${SAMSUNG_ELECTRO_START_DATE:-2024-01-01}
      SAMSUNG_ELECTRO_END_DATE: ${SAMSUNG_ELECTRO_END_DATE:-2025-01-01}
    volumes:
      # LEAN 결과 JSON, 로그, 주문 CSV를 호스트에 보존합니다.
      - ./samsung-electro-results:/results
    restart: "no"
